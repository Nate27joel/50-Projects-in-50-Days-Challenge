<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock UI</title>
  <link rel="stylesheet" href="./style.css">

</head>


<body>

  <!-- =====================================================
       DIGITAL CLOCK

       Change the classes below to change the numbers.

       0 = zero
       1 = one
       2 = two
       3 = three
       4 = four
       5 = five
       6 = six
       7 = seven
       8 = eight
       9 = nine
  ====================================================== -->

  <div class="clock">


    <!-- =====================
         0
    ====================== -->

    <div class="digit zero">

      <span class="segment a"></span>
      <span class="segment b"></span>
      <span class="segment c"></span>
      <span class="segment d"></span>
      <span class="segment e"></span>
      <span class="segment f"></span>
      <span class="segment g"></span>

    </div>


    <!-- =====================
         6
    ====================== -->

    <div class="digit six">

      <span class="segment a"></span>
      <span class="segment b"></span>
      <span class="segment c"></span>
      <span class="segment d"></span>
      <span class="segment e"></span>
      <span class="segment f"></span>
      <span class="segment g"></span>

    </div>


    <!-- =====================
         COLON
    ====================== -->

    <div class="colon">

      <span></span>
      <span></span>

    </div>


    <!-- =====================
         5
    ====================== -->

    <div class="digit five">

      <span class="segment a"></span>
      <span class="segment b"></span>
      <span class="segment c"></span>
      <span class="segment d"></span>
      <span class="segment e"></span>
      <span class="segment f"></span>
      <span class="segment g"></span>

    </div>


    <!-- =====================
         3
    ====================== -->

    <div class="digit three">

      <span class="segment a"></span>
      <span class="segment b"></span>
      <span class="segment c"></span>
      <span class="segment d"></span>
      <span class="segment e"></span>
      <span class="segment f"></span>
      <span class="segment g"></span>

    </div>

  </div>

</body>
</html>
