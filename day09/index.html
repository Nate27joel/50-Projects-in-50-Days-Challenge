<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerPoint Quiz</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>


  <!-- =====================================================
       PRESENTATION SLIDE
  ====================================================== -->

  <main class="slide">


    <!-- Title -->

    <h1 class="title">
      QUIZ FOR FOOTBALL EXPERT
    </h1>


    <!-- Logo -->

    <div class="logo">
      <span>N</span>
    </div>


    <!-- Decorative lines -->

    <div class="line one"></div>
    <div class="line two"></div>


    <!-- =================================================
         QUIZ
    ================================================== -->

    <section class="quiz">


      <!-- Question -->

      <div class="question">
        WHO IS THE GREATEST OF ALL TIME🤗
      </div>


      <!-- Answers -->

      <div class="answers">


        <div class="answer">
          LEO MESSI
        </div>


        <div class="answer">
          C.RONALDO
        </div>


        <div class="answer">
          G.BALE
        </div>


        <div class="answer">
          M.SALAH
        </div>


      </div>

    </section>


    <!-- Bottom decoration -->

    <div class="bottom-line"></div>


  </main>

</body>
</html>
