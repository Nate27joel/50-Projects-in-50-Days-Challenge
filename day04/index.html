<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes the calculator responsive on phones and tablets -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Professional Calculator</title>
  <link rel="stylesheet" href="./style.css">

</head>


<body>


  <!-- =====================================================
       CALCULATOR
       ===================================================== -->

  <main class="calculator">


    <!-- Calculator header -->

    <header class="calculator-header">

      <span class="calculator-title">
        Calculator
      </span>

      <span class="status">

        <span class="status-dot"></span>

        Ready

      </span>

    </header>



    <!-- ===================================================
         DISPLAY
         =================================================== -->

    <section
      class="display"
      aria-label="Calculator display"
    >

      <!-- Previous calculation -->

      <div class="previous-value">
        128 × 4
      </div>


      <!-- Current result -->

      <div class="current-value">
        512
      </div>

    </section>



    <!-- ===================================================
         BUTTONS
         =================================================== -->

    <section
      class="buttons"
      aria-label="Calculator buttons"
    >


      <!-- Row 1 -->

      <button class="key clear">
        AC
      </button>

      <button class="key">
        ±
      </button>

      <button class="key">
        %
      </button>

      <button class="key operator">
        ÷
      </button>


      <!-- Row 2 -->

      <button class="key">
        7
      </button>

      <button class="key">
        8
      </button>

      <button class="key">
        9
      </button>

      <button class="key operator">
        ×
      </button>


      <!-- Row 3 -->

      <button class="key">
        4
      </button>

      <button class="key">
        5
      </button>

      <button class="key">
        6
      </button>

      <button class="key operator">
        −
      </button>


      <!-- Row 4 -->

      <button class="key">
        1
      </button>

      <button class="key">
        2
      </button>

      <button class="key">
        3
      </button>

      <button class="key operator">
        +
      </button>


      <!-- Row 5 -->

      <button class="key">
        0
      </button>

      <button class="key">
        .
      </button>

      <button class="key equals">
        =
      </button>

    </section>



    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer class="calculator-footer">
        NateTexh Calculator
    </footer>


  </main>

</body>
</html>
