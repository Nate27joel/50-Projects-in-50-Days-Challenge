<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Login</title>
  <link rel="stylesheet" href="./style.css">
  
</head>


<body>

  <main class="scene">


    <!-- =====================================================
         BACKGROUND RAYS
    ====================================================== -->

    <div class="rays">

      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>

    </div>


    <!-- =====================================================
         LIGHT STREAKS
    ====================================================== -->

    <span class="streak one"></span>
    <span class="streak two"></span>
    <span class="streak three"></span>
    <span class="streak four"></span>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-wrapper">

      <div class="login-panel">


        <!-- DECORATIVE CORNERS -->

        <span class="corner one"></span>
        <span class="corner two"></span>


        <div class="login-content">


          <!-- =================================================
               TITLE
          ================================================== -->

          <h1 class="login-title">
            Login with
          </h1>

          <p class="login-description">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit,
            sed do eiusmod tempor incididunt ut labore et dolore.
          </p>


          <!-- =================================================
               OPTIONS
          ================================================== -->

          <div class="options">

            <button class="option">

              <span class="option-icon"></span>

              Option 1

            </button>


            <button class="option">

              <span class="option-icon"></span>

              Option 2

            </button>

          </div>


          <!-- =================================================
               SEPARATOR
          ================================================== -->

          <div class="separator"></div>


          <!-- =================================================
               EMAIL
          ================================================== -->

          <div class="input-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
            >

          </div>


          <!-- =================================================
               PASSWORD
          ================================================== -->

          <div class="input-group password-wrapper">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
            >

          </div>


          <!-- =================================================
               LOGIN
          ================================================== -->

          <button class="login-button">
            Login
          </button>


        </div>

      </div>

    </div>

  </main>

</body>
</html>
